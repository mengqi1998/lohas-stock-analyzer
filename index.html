<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>樂活五線譜｜股票分析工具</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", sans-serif;
      background: #f5f7fa;
      color: #263238;
    }

    header {
      background: #173f35;
      color: white;
      padding: 24px 6%;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      color: #d5e5dc;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .search-area {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .search-area input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #d5dce2;
      border-radius: 8px;
      font-size: 15px;
    }

    .search-area button {
      padding: 0 22px;
      border: 0;
      border-radius: 8px;
      background: #26745b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .panel {
      background: white;
      border: 1px solid #e4e9ed;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(30, 50, 40, 0.04);
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .empty {
      padding: 30px 15px;
      text-align: center;
      color: #84919a;
      background: #f8fafb;
      border-radius: 8px;
      line-height: 1.8;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .feature {
      padding: 18px;
      background: #f8faf9;
      border-radius: 9px;
    }

    .feature h3 {
      margin: 0 0 8px;
      color: #26745b;
      font-size: 16px;
    }

    .feature p {
      margin: 0;
      color: #68777e;
      font-size: 14px;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #fff3d9;
      color: #91651a;
      font-size: 12px;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #89949a;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      .feature-grid {
        grid-template-columns: 1fr;
      }

      .search-area {
        flex-direction: column;
      }

      .search-area button {
        padding: 13px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>樂活五線譜</h1>
    <p>用趨勢與價格通道，觀察股票與 ETF 的市場位置</p>
  </header>

  <main>
    <section class="search-area">
      <input type="text" placeholder="輸入台股代號或名稱，例如：2330、0050">
      <button type="button">查詢</button>
    </section>

    <section class="panel">
      <h2>我的常用清單</h2>
      <div class="empty">
        尚未加入追蹤標的<br>
        查詢股票後，可以將常用標的加入清單
      </div>
    </section>

    <section class="panel">
      <h2>樂活五線譜</h2>
      <div class="empty">
        <span class="status">資料功能建置中</span>
        <p>將顯示最近 500 個交易日的股價趨勢線與 ±1σ、±2σ 通道</p>
      </div>
    </section>

    <section class="panel">
      <h2>基本面 GPS</h2>
      <div class="feature-grid">
        <div class="feature">
          <h3>PER 本益比</h3>
          <p>觀察股價相對於獲利的評價。</p>
        </div>
        <div class="feature">
          <h3>PBR 股價淨值比</h3>
          <p>觀察股價相對於每股淨值的水準。</p>
        </div>
        <div class="feature">
          <h3>殖利率</h3>
          <p>輔助評估股票的現金股利報酬。</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    樂活五線譜｜台灣上市、上櫃股票與 ETF 分析工具
  </footer>

</body>
</html>
