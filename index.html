
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>樂活五線譜｜股票分析站</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 16px;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: #f5f7fa;
  color: #263445;
}

.container {
  max-width: 1100px;
  margin: auto;
}

header {
  margin-bottom: 25px;
}

h1 {
  margin-bottom: 8px;
}

.subtitle {
  color: #718096;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 2px 10px rgba(0,0,0,.04);
}

.search-row {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #d8dee8;
  border-radius: 8px;
  font-size: 16px;
}

button {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  background: #315b82;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.status {
  margin-top: 12px;
  color: #718096;
  font-size: 14px;
}

.error {
  color: #c0392b;
}

.hidden {
  display: none !important;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 20px;
}

.summary-item {
  background: #f7f9fc;
  border-radius: 8px;
  padding: 18px;
}

.label {
  color: #718096;
  font-size: 13px;
  margin-bottom: 8px;
}

.value {
  font-size: 23px;
  font-weight: bold;
}

.line-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 18px;
}

.line-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: #f7f9fc;
  border-radius: 8px;
  padding: 15px;
}

.line-name {
  color: #718096;
  font-size: 14px;
}

.line-value {
  font-weight: bold;
  font-size: 18px;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.chart-container {
  position: relative;
  width: 100%;
  height: 430px;
}

.chart-note {
  color: #8793a1;
  font-size: 12px;
  margin-top: 15px;
  line-height: 1.7;
}

.disclaimer {
  color: #8793a1;
  font-size: 12px;
  line-height: 1.8;
  margin-top: 25px;
}

@media (max-width: 600px) {
  body {
    padding: 20px 12px;
  }

  .summary {
    grid-template-columns: 1fr;
  }

  .line-list {
    grid-template-columns: 1fr;
  }

  .search-row {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .chart-container {
    height: 350px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>樂活五線譜</h1>
  <div class="subtitle">台灣股票與 ETF 趨勢分析</div>
</header>

<section class="card">
  <h3>股票查詢</h3>

  <div class="search-row">
    <input
      id="stockId"
      type="text"
      value="2330"
      placeholder="請輸入股票代號，例如 2330"
    >
    <button id="searchBtn" onclick="searchStock()">查詢</button>
  </div>

  <div id="status" class="status">
    請輸入股票代號開始查詢。
  </div>
</section>

<section id="result" class="hidden">

  <div class="card">
    <h2 id="stockTitle">股票分析</h2>

    <div class="summary">
      <div class="summary-item">
        <div class="label">最新資料日期</div>
        <div class="value" id="latestDate">-</div>
      </div>

      <div class="summary-item">
        <div class="label">最新收盤價</div>
        <div class="value" id="latestClose">-</div>
      </div>

      <div class="summary-item">
        <div class="label">分析交易日數</div>
        <div class="value" id="actualDays">-</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>樂活五線譜數值</h3>

    <div class="line-list">
      <div class="line-item">
        <span class="line-name">上上線（+2σ）</span>
        <span class="line-value" id="upper2">-</span>
      </div>

      <div class="line-item">
        <span class="line-name">上線（+1σ）</span>
        <span class="line-value" id="upper1">-</span>
      </div>

      <div class="line-item">
        <span class="line-name">中線（趨勢線）</span>
        <span class="line-value" id="trend">-</span>
      </div>

      <div class="line-item">
        <span class="line-name">下線（-1σ）</span>
        <span class="line-value" id="lower1">-</span>
      </div>

      <div class="line-item">
        <span class="line-name">下下線（-2σ）</span>
        <span class="line-value" id="lower2">-</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="chart-header">
      <h3>歷史股價與五線譜</h3>
      <span id="chartPeriod" class="subtitle">最近 500 個交易日</span>
    </div>

    <div class="chart-container">
      <canvas id="fiveLineChart"></canvas>
    </div>

    <div class="chart-note">
      將滑鼠移至圖表上的任一日期，可查看當日收盤價及五條線的數值。
    </div>
  </div>

</section>

<div class="disclaimer">
  資料來源：FinMind。五線譜為統計分析工具，僅供研究參考，
  不代表未來股價走勢，也不構成投資建議。
  目前測試版本使用一般收盤價，尚未完成除權息還原。
</div>

</div>

<script>
let fiveLineChart = null;


// =========================
// 股票查詢
// =========================

async function searchStock() {

  const stockId = document
    .getElementById("stockId")
    .value.trim();

  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const button = document.getElementById("searchBtn");

  if (!/^[0-9A-Za-z]{4,6}$/.test(stockId)) {
    status.textContent = "請輸入正確的股票或 ETF 代號。";
    status.className = "status error";
    result.classList.add("hidden");
    return;
  }

  button.disabled = true;
  status.textContent = "正在讀取分析資料...";
  status.className = "status";
  result.classList.add("hidden");

  try {

    const response = await fetch(
      `data/five_lines/${encodeURIComponent(stockId)}.json?t=${Date.now()}`
    );

    if (!response.ok) {
      throw new Error(
        "找不到此標的的分析資料，請確認代號或等待資料更新。"
      );
    }

    const data = await response.json();

    if (data.status !== "success") {
      throw new Error(
        data.message || "目前資料不足，無法計算五線譜。"
      );
    }

    if (!data.data || data.data.length === 0) {
      throw new Error("分析資料內容為空。");
    }

    const latest = data.data[data.data.length - 1];

    // 基本資料
    document.getElementById("stockTitle").textContent =
      `${data.stock_id} 股票分析`;

    document.getElementById("latestDate").textContent =
      latest.date;

    document.getElementById("latestClose").textContent =
      Number(latest.close).toFixed(2);

    document.getElementById("actualDays").textContent =
      `${data.actual_days} 日`;

    // 五線譜數值
    document.getElementById("upper2").textContent =
      Number(latest.upper_2).toFixed(2);

    document.getElementById("upper1").textContent =
      Number(latest.upper_1).toFixed(2);

    document.getElementById("trend").textContent =
      Number(latest.trend).toFixed(2);

    document.getElementById("lower1").textContent =
      Number(latest.lower_1).toFixed(2);

    document.getElementById("lower2").textContent =
      Number(latest.lower_2).toFixed(2);

    // 繪製圖表
    renderChart(data.data);

    document.getElementById("chartPeriod").textContent =
      `最近 ${data.actual_days} 個交易日`;

    result.classList.remove("hidden");

    status.textContent = "查詢成功！";
    status.className = "status";

  } catch (error) {

    status.textContent = error.message;
    status.className = "status error";

  } finally {

    button.disabled = false;

  }
}


// =========================
// 繪製五線譜圖表
// =========================

function renderChart(rows) {

  const labels = rows.map(item => item.date);

  const makeDataset = (label, field, color, width, dash = []) => ({
    label: label,
    data: rows.map(item => Number(item[field])),
    borderColor: color,
    borderWidth: width,
    borderDash: dash,
    pointRadius: 0,
    pointHoverRadius: 4,
    tension: 0,
    fill: false
  });

  const datasets = [

    makeDataset(
      "收盤價",
      "close",
      "#263f8c",
      2.5
    ),

    makeDataset(
      "上上線 +2σ",
      "upper_2",
      "#c65d5d",
      1.5,
      [6, 4]
    ),

    makeDataset(
      "上線 +1σ",
      "upper_1",
      "#df9c54",
      1.5,
      [4, 3]
    ),

    makeDataset(
      "中線",
      "trend",
      "#319b83",
      2
    ),

    makeDataset(
      "下線 -1σ",
      "lower_1",
      "#df9c54",
      1.5,
      [4, 3]
    ),

    makeDataset(
      "下下線 -2σ",
      "lower_2",
      "#c65d5d",
      1.5,
      [6, 4]
    )

  ];

  const ctx = document
    .getElementById("fiveLineChart")
    .getContext("2d");

  // 如果之前已經有圖表，先銷毀再重新建立
  if (fiveLineChart) {
    fiveLineChart.destroy();
  }

  fiveLineChart = new Chart(ctx, {

    type: "line",

    data: {
      labels: labels,
      datasets: datasets
    },

    options: {

      responsive: true,
      maintainAspectRatio: false,

      interaction: {
        mode: "index",
        intersect: false
      },

      plugins: {

        legend: {
          position: "bottom",
          labels: {
            usePointStyle: true,
            boxWidth: 12,
            padding: 16
          }
        },

        tooltip: {
          enabled: true,
          callbacks: {
            title: function(items) {
              return items[0].label;
            },

            label: function(context) {
              return `${context.dataset.label}：${Number(context.raw).toFixed(2)}`;
            }
          }
        }

      },

      scales: {

        x: {
          ticks: {
            maxTicksLimit: 10,
            maxRotation: 0
          },

          grid: {
            display: false
          }
        },

        y: {
          title: {
            display: true,
            text: "價格"
          },

          ticks: {
            callback: function(value) {
              return Number(value).toFixed(0);
            }
          }
        }

      }

    }

  });

}


// =========================
// Enter 鍵查詢
// =========================

document
  .getElementById("stockId")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      searchStock();
    }

  });


// 預設載入台積電
searchStock();

</script>

</body>
</html>
