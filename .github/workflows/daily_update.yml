
name: Daily Stock Data Update

on:
  schedule:
    # 台灣時間週一至週五 18:30，避開開盤前只能取得前一交易日資料的情況
    - cron: "30 10 * * 1-5"

  workflow_dispatch:

  # 程式碼更新時自動驗證並重建資料；資料檔提交不會再次觸發，避免無限循環
  push:
    branches:
      - main
    paths:
      - "python/**"
      - "index.html"
      - "requirements.txt"
      - ".github/workflows/daily_update.yml"

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch stock data
        run: python python/fetch_stock.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: Calculate five lines
        run: python python/calculate_five_lines.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update stock data and five lines"
          git push
